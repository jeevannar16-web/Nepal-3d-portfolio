    <circle cx="330" cy="330" r="6" fill="#1c1c26"/>
    <line x1="302" y1="322" x2="328" y2="320" stroke="#ffb347" stroke-width="4" stroke-linecap="round"/>
    <line x1="314" y1="322" x2="310" y2="312" stroke="#ffb347" stroke-width="3" stroke-linecap="round"/>
    <line x1="310" y1="312" x2="299" y2="312" stroke="#1c1c26" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Horse -->
  <g>
    <rect x="440" y="332" width="4" height="9" rx="1.5" fill="#5a3a22"/>
    <rect x="452" y="332" width="4" height="9" rx="1.5" fill="#5a3a22"/>
    <rect x="466" y="332" width="4" height="9" rx="1.5" fill="#5a3a22"/>
    <rect x="478" y="332" width="4" height="9" rx="1.5" fill="#5a3a22"/>
    <ellipse cx="460" cy="326" rx="21" ry="9" fill="#7a5230"/>
    <polygon points="476,322 488,312 484,328" fill="#7a5230"/>
    <ellipse cx="489" cy="312" rx="6" ry="4.5" fill="#7a5230"/>
    <polygon points="486,308 489,302 492,308" fill="#5a3a22"/>
    <polygon points="489,308 493,303 496,308" fill="#5a3a22"/>
    <ellipse cx="485" cy="309" rx="1.6" ry="2.4" fill="#f2ede3"/>
    <path d="M442 324 q-8 2-7 8" stroke="#5a3a22" stroke-width="3" fill="none" stroke-linecap="round"/>
