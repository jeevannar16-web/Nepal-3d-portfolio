<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1150"/>
      <stop offset="0.6" stop-color="#7a3f9e"/>
      <stop offset="1" stop-color="#f5b06e"/>
    </linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6b3e"/>
      <stop offset="1" stop-color="#2a4a2c"/>
    </linearGradient>
    <radialGradient id="balloon" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff8ab0"/>
      <stop offset="0.45" stop-color="#c85aa8"/>
      <stop offset="1" stop-color="#7e14ff"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="120" cy="252" r="26" fill="#ffd166" opacity="0.95"/>

  <polygon points="0,270 90,238 180,258 260,226 350,252 430,232 520,256 600,242 640,258 640,290 0,290" fill="#3a2a63"/>
  <polygon points="0,290 130,270 250,280 380,266 500,280 620,270 640,276 640,300 0,300" fill="#4a3478"/>
  <rect y="288" width="640" height="112" fill="url(#valley)"/>

  <!-- Road -->
