  <circle cx="320" cy="330" r="88" stroke="#47bfff" stroke-width="2.5" fill="none" opacity="0.5"/>

  <!-- Stupa -->
  <g>
    <rect x="484" y="330" width="34" height="14" fill="#8a6a45"/>
    <rect x="491" y="310" width="20" height="22" fill="#c99a63"/>
    <path d="M491 312 a10 10 0 0 1 20 0 z" fill="#f2ede3"/>
    <rect x="497" y="300" width="6" height="12" fill="#f2c14e"/>
    <circle cx="500" cy="296" r="4" fill="#f2c14e"/>
    <line x1="500" y1="292" x2="500" y2="286" stroke="#4a2f1d" stroke-width="2"/>
