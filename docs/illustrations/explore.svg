  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="540" cy="258" r="28" fill="#ffd166" opacity="0.95"/>

  <polygon points="0,288 90,252 170,274 250,238 340,268 420,246 500,272 580,256 640,270 640,300 0,300" fill="#3a2a63"/>
  <polygon points="0,300 120,280 240,290 360,276 480,288 600,280 640,286 640,320 0,320" fill="#4a3478"/>
  <rect y="295" width="640" height="105" fill="url(#valley)"/>

  <!-- ground glow rings marking explorable zones -->
  <ellipse cx="320" cy="352" rx="72" ry="14" stroke="#47bfff" stroke-width="2.5" fill="none" opacity="0.5"/>
  <ellipse cx="500" cy="342" rx="54" ry="11" stroke="#47bfff" stroke-width="2" fill="none" opacity="0.4"/>
  <ellipse cx="128" cy="346" rx="50" ry="10" stroke="#47bfff" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- City gate -->
