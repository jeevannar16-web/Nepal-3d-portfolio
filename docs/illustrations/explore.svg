    <rect x="316" y="312" width="8" height="22" fill="#f2c14e"/>
    <circle cx="320" cy="308" r="4.5" fill="#f2c14e"/>
    <polygon points="292,324 320,306 348,324 320,317" fill="#4a2f1d"/>
    <polygon points="284,338 320,318 356,338 320,330" fill="#4a2f1d"/>
    <rect x="290" y="334" width="60" height="34" fill="#c99a63"/>
    <polygon points="272,356 320,332 368,356 320,346" fill="#4a2f1d"/>
